[workspace]
members = [
    "crates/hermes-core",
    "crates/hermes",
    "crates/hermes-agent",
    "crates/hermes-acp",
]
resolver = "2"

[workspace.package]
version = "0.12.0"
edition = "2024"
license = "MIT"
authors = ["Nous Research"]

[workspace.dependencies]
aes = "0.9.0"
axum = "0.8.6"
aws-config = { version = "1.8.16", features = ["behavior-version-latest"] }
aws-sdk-bedrockruntime = "1.130.0"
aws-smithy-types = "1.4.7"
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = true, features = ["clock"] }
clap = { version = "4.5.41", features = ["derive"] }
cronexpr = "1.5.0"
ctrlc = "3.5.0"
dirs = "6.0.0"
flate2 = "1.1.5"
getrandom = "0.3.4"
hmac = "0.12.1"
image = { version = "0.25.8", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
jsonwebtoken = "9.3.1"
lettre = { version = "0.11.22", default-features = false, features = ["builder", "smtp-transport", "hostname", "pool", "rustls-tls"] }
libc = "0.2.177"
log = "0.4.28"
md5 = "0.7.0"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
regex = "1.12.2"
ring = "0.17.14"
rusqlite = { version = "0.32.1", features = ["bundled", "backup"] }
shell-words = "1.1.0"
tar = "0.4.44"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
sha1 = "0.10.6"
sha2 = "0.10.9"
tokio = { version = "1.52.2", features = ["full"] }
tokio-stream = "0.1.17"
tungstenite = { version = "0.24.0", features = ["rustls-tls-webpki-roots"] }
unicode-normalization = "0.1.24"
url = "2.5.7"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
